<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Bruksstatistikk · Familielogistikk</title>
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one column, headline answer first (are families using it daily?), then trend, features, families */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --ink:#16302B; --muted:#5A6E69; --line:#D5DEDB; --soft:#E6ECEA;
  --accent:#E09A12; --ok:#1E7A4C; --warn:#B4332E;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1917; --surface:#152320; --ink:#E3ECE9; --muted:#93A7A2; --line:#263834; --soft:#1C2D29;
  --accent:#F2B744; --ok:#5CCB8F; --warn:#F07A72; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
main{max-width:980px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{margin:0;font-family:var(--f-display);font-size:clamp(1.7rem,5vw,2.4rem);letter-spacing:-.02em;line-height:1.05}
h1 small{display:block;font-family:var(--f-mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:4px}
h2{margin:0 0 10px;font-family:var(--f-display);font-size:1.15rem}
a.back{color:var(--ink);font-weight:700;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px;background:var(--surface)}
.answer{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:center}
.answer .big{font-family:var(--f-display);font-size:clamp(2.4rem,8vw,3.4rem);line-height:1;font-variant-numeric:tabular-nums}
.answer p{margin:0;color:var(--muted);max-width:60ch}
.answer b{color:var(--ink)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:var(--ok)}
.pill.no{background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--warn)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile span{display:block;font-size:.82rem;color:var(--muted)}
.tile b{font-family:var(--f-mono);font-size:1.5rem;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 20px}
.feat div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:6px 0}
.feat b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:520px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.dots{display:inline-flex;gap:3px}
.dots i{width:10px;height:10px;border-radius:3px;background:var(--soft)}
.dots i.on{background:var(--ok)}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;color:var(--muted)}
.note{font-size:.82rem;color:var(--muted);margin:0}
#out{display:flex;flex-direction:column;gap:14px}
</style>
</head>
<body>
<main>
  <header>
    <h1><small>Familielogistikk · kun for deg</small>Bruksstatistikk</h1>
    <a class="back" href="/">← Til appen</a>
  </header>
  <div id="out"><div class="msg">Henter tall …</div></div>
  <p class="note">Statistikken er anonym: den teller bare hvilke dager en konto åpnet appen, og antall avtaler, beskjeder og oppgaver. Ingen navn eller innhold vises. Familiene er merket med en tilfeldig kode.</p>
</main>
<script>
(async()=>{
  const out=document.getElementById("out");
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  let r; try{ r=await fetch("/api/admin/stats",{credentials:"same-origin"}); }catch{ out.innerHTML='<div class="msg">Ingen nettverksforbindelse.</div>'; return; }
  if(r.status===401){ out.innerHTML='<div class="msg">Du er ikke logget inn. <a href="/">Logg inn i appen</a> og kom tilbake hit.</div>'; return; }
  if(r.status===403){ out.innerHTML='<div class="msg">Denne siden er bare for administratorer. Legg e-postadressen din i <code>ADMIN_EMAILS</code> i Render.</div>'; return; }
  if(!r.ok){ out.innerHTML='<div class="msg">Kunne ikke hente statistikken. Prøv igjen.</div>'; return; }
  const d=await r.json(); const t=d.totals, a=d.active, f=d.features;
  const wau=a.wau_families||0, eng=a.engaged_families||0;
  const share=wau?Math.round(100*eng/wau):0;
  const ok=share>=50;
  const nf=n=>new Intl.NumberFormat("nb-NO").format(n||0);

  // Chart: daily active families (bars) and users (line), last 30 days
  const W=900,H=220,pl=34,pr=10,pt=12,pb=26; const days=d.daily;
  const max=Math.max(2,...days.map(x=>Math.max(x.families,x.users)));
  const step=Math.ceil(max/4); const top=step*4;
  const x=i=>pl+(W-pl-pr)*(i+.5)/days.length, y=v=>pt+(H-pt-pb)*(1-v/top), bw=Math.max(4,(W-pl-pr)/days.length-6);
  let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Aktive familier og brukere per dag, siste 30 dager">`;
  for(let v=0;v<=top;v+=step){ svg+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${v}</text>`; }
  days.forEach((p,i)=>{ svg+=`<rect x="${x(i)-bw/2}" y="${y(p.families)}" width="${bw}" height="${Math.max(0,y(0)-y(p.families))}" rx="2" fill="var(--ok)" opacity=".85"><title>${esc(p.day)}: ${p.families} familier, ${p.users} brukere</title></rect>`; });
  svg+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${days.map((p,i)=>`${x(i)},${y(p.users)}`).join(" ")}"/>`;
  days.forEach((p,i)=>{ if(i%7===days.length%7||i===days.length-1){ const [,mo,da]=p.day.split("-").map(Number); svg+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${da}.${mo}</text>`; } });
  svg+=`</svg>`;

  const famRows=d.families.map(r=>{ return `<tr><td><code>${esc(r.ref)}</code></td><td class="num">${esc(String(r.created).slice(0,10))}</td><td class="num">${r.accounts}</td><td><span class="dots" aria-label="${r.days_7d} av 7 dager">${[...Array(7)].map((_,i)=>`<i class="${i<r.days_7d?"on":""}"></i>`).join("")}</span> <span class="num">${r.days_7d}/7</span></td><td class="num">${esc(r.last_seen||"–")}</td></tr>`; }).join("");

  out.innerHTML=`
  <section class="answer">
    <span class="big">${share} %</span>
    <p>av familiene som var aktive siste 7 dager, brukte appen <b>4 dager eller mer</b> (${eng} av ${wau}). <span class="pill ${ok?"ok":"no"}">${ok?"Over målet på 50 %":"Under målet på 50 %"}</span></p>
  </section>
  <section class="tiles">
    <div class="tile"><span>Familier totalt</span><b>${nf(t.families)}</b></div>
    <div class="tile"><span>Kontoer (barn)</span><b>${nf(t.accounts)} <small style="font-size:.9rem;color:var(--muted)">(${nf(t.child_accounts)})</small></b></div>
    <div class="tile"><span>Nye familier, 7 dager</span><b>${nf(t.new_families_7d)}</b></div>
    <div class="tile"><span>Aktive familier, 7 dager</span><b>${nf(wau)}</b></div>
    <div class="tile"><span>Aktive familier, 30 dager</span><b>${nf(a.mau_families)}</b></div>
    <div class="tile"><span>Familier med 2+ aktive</span><b>${nf(a.multi_user_families)}</b></div>
  </section>
  <section class="card"><h2>Aktive per dag, siste 30 dager</h2>${svg}
    <div class="legend"><span><i style="background:var(--ok)"></i>Familier</span><span><i style="background:var(--accent)"></i>Brukere</span></div></section>
  <section class="card"><h2>Hva brukes, siste 7 dager</h2><div class="feat">
    <div><span>Avtaler lagt inn eller endret</span><b>${nf(f.events_7d)}</b></div>
    <div><span>Beskjeder</span><b>${nf(f.notes_7d)}</b></div>
    <div><span>Bekreftelser («tar den»)</span><b>${nf(f.confirmations_7d)}</b></div>
    <div><span>Oppgaver levert</span><b>${nf(f.chores_done_7d)}</b></div>
    <div><span>Familier med ukesoppgaver</span><b>${nf(f.families_with_chores)}</b></div>
    <div><span>Familier med Spond/kalender</span><b>${nf(f.families_with_feeds)}</b></div>
  </div></section>
  <section class="card"><h2>Familiene</h2><div class="tablewrap"><table>
    <thead><tr><th>Kode</th><th>Startet</th><th>Kontoer</th><th>Aktive dager, siste 7</th><th>Sist sett</th></tr></thead>
    <tbody>${famRows||'<tr><td colspan="5">Ingen familier ennå.</td></tr>'}</tbody></table></div></section>`;
})();
</script>
</body>
</html>
