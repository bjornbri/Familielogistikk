# Render Blueprint: én webtjeneste og én Postgres-database.
# I Render: New + → Blueprint → velg dette repoet.
services:
  - type: web
    name: familielogistikk
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: familielogistikk-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false   # valgfri: slår på lesing av avtaler fra bilder
      - key: GOOGLE_MAPS_API_KEY
        sync: false   # valgfri: slår på stedssøk med Google Maps
      - key: ADMIN_EMAILS
        sync: false   # din e-post: gir tilgang til /admin (bruksstatistikk)
      - key: RESEND_API_KEY
        sync: false   # e-post for «Glemt passord» (resend.com)
      - key: MAIL_FROM
        value: "Familielogistikk <noreply@familielogistikk.no>"

databases:
  - name: familielogistikk-db
    plan: free
    region: frankfurt
    databaseName: familielogistikk
    user: familielogistikk
